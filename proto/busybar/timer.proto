syntax = "proto3";
option go_package = "github.com/brotherlogic/busybar-bridge/pkg/pb/busybar;busybar";

import "util/json.proto";

package BSB_Timer;

message Profile {
    string name = 1;
    BSB_Util.Json json = 2;
}

message Profiles {
    repeated Profile profiles = 1;
}

message Timer {
    BSB_Util.Json json = 1;
}
