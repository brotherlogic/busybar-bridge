syntax = "proto3";
option go_package = "github.com/brotherlogic/busybar-bridge/pkg/pb/busybar;busybar";

package BSB_State;

message Timezone {
    string name = 1; /* Timezone name */
    sint32 offset = 2; /* Offset from UTC in minutes */
    string abbr = 3; /* Timezone abbreviation (e.g. CEST) */
}
